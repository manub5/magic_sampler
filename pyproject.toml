[project]
name = "choppeur"
version = "0.1.0"
description = "Extraction automatique de samples (boucles et one-shots) depuis une bibliothèque d'albums"
requires-python = ">=3.12,<3.13"
dependencies = [
    "PySide6>=6.7",
    "pyqtgraph>=0.13",
    "librosa==0.11.*",
    "soundfile>=0.12",
    "sounddevice>=0.4",
    "mutagen>=1.47",
    "platformdirs>=4",
    "tomli-w>=1.0",
    "torch>=2.0",
    "einops",
    "soxr",
    "rotary-embedding-torch",
    "beat_this @ https://github.com/CPJKU/beat_this/archive/main.zip",
]

[project.scripts]
choppeur = "choppeur.app:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/choppeur"]
