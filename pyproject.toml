[project]
name = "choppeur"
version = "0.1.0"
description = "Extraction automatique de samples (boucles et one-shots) depuis une bibliothèque d'albums"
requires-python = ">=3.12,<3.13"
dependencies = [
    "PySide6>=6.7",
    "pyqtgraph>=0.13",
    "librosa==0.11.*",
    "soundfile>=0.12",
    "sounddevice>=0.4",
    "mutagen>=1.47",
    "platformdirs>=4",
    "tomli-w>=1.0",
    "torch>=2.0",
    "torchaudio>=2.0",
    "einops",
    "soxr",
    "rotary-embedding-torch",
    "beat-this>=1.1.0",
]

[project.scripts]
choppeur = "choppeur.app:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.16", "mypy>=1.14", "bandit>=1.9", "pre-commit>=4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/choppeur"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchaudio = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "BLE", "C4", "SIM", "RUF", "PLW", "PYI"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
# Bibliothèques sans annotations de type ni marqueur py.typed : on ne peut
# pas vérifier leur usage précisément, mais ça ne doit pas bloquer le reste.
module = ["pyqtgraph.*", "soundfile.*", "sounddevice.*", "beat_this.*"]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
